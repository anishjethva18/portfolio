[build]
  command = "npm ci --prefix client && npm --prefix client run build"
  publish = "client/dist"

[[edge_functions]]
  function = "seo-metadata"
  path = "/"

[[redirects]]
  from = "/social-preview.jpg"
  to = "https://portfolio-ub24.onrender.com/social-preview.jpg"
  status = 200
  force = true

[[redirects]]
  from = "/social-preview.png"
  to = "https://portfolio-ub24.onrender.com/social-preview.png"
  status = 200
  force = true

[[redirects]]
  from = "/social-preview.webp"
  to = "https://portfolio-ub24.onrender.com/social-preview.webp"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://portfolio-ub24.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
